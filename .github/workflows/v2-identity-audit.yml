name: V2 identity audit

on:
  push:
    paths:
      - README.md
      - 'docs/research/**'
      - 'scripts/verify_v2_identity.py'
      - 'tests/**'
      - requirements-audit.txt
      - '.github/workflows/v2-identity-audit.yml'
  pull_request:
    paths:
      - README.md
      - 'docs/research/**'
      - 'scripts/verify_v2_identity.py'
      - 'tests/**'
      - requirements-audit.txt
      - '.github/workflows/v2-identity-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mathematical-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-audit.txt
      - run: python -m pytest -q
      - run: python scripts/verify_v2_identity.py --output /tmp/v2_identity.json
